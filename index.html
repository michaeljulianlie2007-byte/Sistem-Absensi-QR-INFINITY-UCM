<!DOCTYPE html>
<html>
<head>
  <title>QR Scanner Eksternal</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    #reader { width: 100%; max-width: 500px; margin: 20px auto; }
    #status { margin-top: 20px; padding: 15px; font-weight: bold; background: #eef; border-radius: 5px; }
  </style>
</head>
<body>
  <h2>Sistem Absensi (Web Mandiri)</h2>
  <div id="reader"></div>
  <div id="status">Memuat kamera...</div>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbyL1RtuBShto37PYmd17FTBaZ3gF3o15G7FDoafA8vf0rTtsYJcjnygBhe2nT0tqK3k/exec";

    let isProcessing = false;

    function onScanSuccess(decodedText, decodedResult) {
      if (isProcessing) return;
      isProcessing = true;
      
      document.getElementById('status').style.backgroundColor = "#fff3cd";
      document.getElementById('status').innerText = "Menyimpan: " + decodedText;

      // Mengirim data ke Google Sheet
      fetch(urlGoogleScript + "?data=" + encodeURIComponent(decodedText))
        .then(response => response.text())
        .then(hasil => {
          document.getElementById('status').style.backgroundColor = "#d4edda";
          document.getElementById('status').innerText = hasil;
          
          setTimeout(() => { 
            isProcessing = false; 
            document.getElementById('status').style.backgroundColor = "#eef";
            document.getElementById('status').innerText = "Siap untuk scan berikutnya...";
          }, 3000);
        })
        .catch(error => {
          document.getElementById('status').style.backgroundColor = "#f8d7da";
          document.getElementById('status').innerText = "Gagal koneksi. Coba lagi.";
          isProcessing = false;
        });
    }

    // Memulai kamera laptop secara otomatis
    var html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
